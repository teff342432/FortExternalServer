
name: Build FortExternalServer 13.40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          repository: OGFN-Open-sourceing/FortExternalServer
          ref: season-13
          submodules: recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Compilar Release x64
        shell: pwsh
        run: |
          msbuild FortExternalServer.sln /m /p:Configuration=Release /p:Platform=x64 /p:FortExternalServerToolset=v143

      - name: Salvar executavel
        uses: actions/upload-artifact@v4
        with:
          name: FortExternalServer-13.40-x64
          path: Binaries/Win64/FortExternalServer.exe
          if-no-files-found: error
